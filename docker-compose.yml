services:
  postgres:
    image: postgres:15
    container_name: pm_postgres
    environment:
      POSTGRES_USER: pmuser
      POSTGRES_PASSWORD: pmpassword
      POSTGRES_DB: pmdb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmuser -d pmdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  app-setup:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npm install && 
             npm install --prefix apps/backend && 
             npm install --prefix apps/frontend && 
             npm run prisma:generate --prefix apps/backend && 
             npm run prisma:migrate --prefix apps/backend && 
             npm run prisma:seed"
    environment:
      - DATABASE_URL=postgresql://pmuser:pmpassword@postgres:5432/pmdb

  backend:
    image: node:22
    working_dir: /app/apps/backend
    volumes:
      - ./:/app
    ports:
      - '5000:5000'
    depends_on:
      app-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: npm run dev
    environment:
      - DATABASE_URL=postgresql://pmuser:pmpassword@postgres:5432/pmdb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_REFRESH_SECRET=your-refresh-secret-change-in-production
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=5000
      - UPLOAD_DIR=./uploads
      - FRONTEND_URL=http://localhost:3000

  frontend:
    image: node:22
    working_dir: /app/apps/frontend
    volumes:
      - ./:/app
    ports:
      - '3000:3000'
    depends_on:
      app-setup:
        condition: service_completed_successfully
    command: npm run dev
    environment:
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_USE_MOCK_AUTH=false

volumes:
  pgdata:
